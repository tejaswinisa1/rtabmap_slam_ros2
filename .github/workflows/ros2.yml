name: UAV SLAM Build — ROS2 Jazzy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ── Global environment ────────────────────────────────────────────────────────
env:
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  ROS_DISTRO: jazzy
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build UAV SLAM — ROS2 Jazzy (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    container:
      image: osrf/ros:jazzy-desktop-full
      # Ensure bash is the default shell inside the container
      options: --user root

    # ── Default shell for ALL steps: bash ─────────────────────────────────────
    defaults:
      run:
        shell: bash

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: src/rtabmap_slam_ros2

      # ── 2. Debug environment ─────────────────────────────────────────────────
      - name: Debug — print environment
        shell: bash
        run: |
          echo "=== Shell ==="
          echo "SHELL: $SHELL"
          echo "BASH_VERSION: $BASH_VERSION"
          echo ""
          echo "=== ROS ==="
          echo "ROS_DISTRO: $ROS_DISTRO"
          source /opt/ros/jazzy/setup.bash
          echo "ROS_VERSION: $ROS_VERSION"
          echo "ROS_PYTHON_VERSION: $ROS_PYTHON_VERSION"
          echo ""
          echo "=== Python ==="
          python3 --version
          echo ""
          echo "=== Colcon ==="
          colcon version-check 2>/dev/null || echo "colcon version-check not available"
          echo ""
          echo "=== Workspace ==="
          ls -la
          ls -la src/

      # ── 3. Install system dependencies ───────────────────────────────────────
      - name: Install system dependencies
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ros-jazzy-rtabmap-ros \
            ros-jazzy-realsense2-camera \
            ros-jazzy-mavros \
            ros-jazzy-mavros-extras \
            ros-jazzy-mavros-msgs \
            ros-jazzy-tf2-ros \
            ros-jazzy-tf2-tools \
            ros-jazzy-cv-bridge \
            ros-jazzy-image-transport \
            ros-jazzy-cyclonedds \
            ros-jazzy-rmw-cyclonedds-cpp \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-opencv \
            python3-numpy \
            python3-setuptools \
            python3-pip
          echo "=== Installing GeographicLib datasets ==="
          /opt/ros/jazzy/lib/mavros/install_geographiclib_datasets.sh || true
          echo "=== Dependencies installed ==="

      # ── 4. rosdep ─────────────────────────────────────────────────────────────
      - name: rosdep install
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          # Init rosdep (ignore error if already initialised)
          rosdep init || true
          rosdep update --rosdistro jazzy
          rosdep install \
            --from-paths src \
            --ignore-src \
            --rosdistro jazzy \
            -r -y \
            --skip-keys "rtabmap_costmap_plugins rtabmap_demos nav2_msgs octomap_msgs grid_map_ros"

      # ── 5. Build UAV packages ─────────────────────────────────────────────────
      - name: Build UAV packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          export RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
          echo "Building with RMW: $RMW_IMPLEMENTATION"
          colcon build \
            --packages-select uav_nodes uav_slam_launch \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_STANDARD=17 \
            --parallel-workers 2 \
            --event-handlers console_cohesion+
          echo "=== Build complete ==="

      # ── 6. Verify entry points ────────────────────────────────────────────────
      - name: Verify UAV package entry points
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          echo "=== Installed UAV packages ==="
          ros2 pkg list | grep uav
          echo ""
          echo "=== UAV node executables ==="
          ros2 pkg executables uav_nodes
          echo ""
          echo "=== uav_slam_launch share files ==="
          ls $(ros2 pkg prefix uav_slam_launch)/share/uav_slam_launch/launch/
          echo ""
          echo "=== Params file ==="
          ls $(ros2 pkg prefix uav_slam_launch)/share/uav_slam_launch/params/
          echo ""
          echo "=== Config files ==="
          ls $(ros2 pkg prefix uav_slam_launch)/share/uav_slam_launch/config/
