name: UAV SLAM Build — ROS2 Jazzy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build UAV SLAM — ROS2 Jazzy (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    container:
      image: osrf/ros:jazzy-desktop-full

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            ros-jazzy-rtabmap-ros \
            ros-jazzy-realsense2-camera \
            ros-jazzy-mavros \
            ros-jazzy-mavros-extras \
            ros-jazzy-tf2-ros \
            ros-jazzy-cv-bridge \
            ros-jazzy-cyclonedds \
            ros-jazzy-rmw-cyclonedds-cpp \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-opencv \
            python3-setuptools
          /opt/ros/jazzy/lib/mavros/install_geographiclib_datasets.sh || true

      - name: Set CycloneDDS as RMW
        run: echo "RMW_IMPLEMENTATION=rmw_cyclonedds_cpp" >> $GITHUB_ENV

      - name: rosdep install
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y \
            --skip-keys "rtabmap_costmap_plugins rtabmap_demos nav2_msgs octomap_msgs grid_map_ros"

      - name: Build UAV packages
        run: |
          source /opt/ros/jazzy/setup.bash
          export RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
          colcon build \
            --packages-select uav_nodes uav_slam_launch \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 \
            --parallel-workers 2

      - name: Verify entry points
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ros2 pkg list | grep uav
