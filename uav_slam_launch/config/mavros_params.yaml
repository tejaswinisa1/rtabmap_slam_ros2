# MAVROS configuration for PX4 + RTAB-Map UAV system
# ROS2 Jazzy — Ubuntu 24.04

mavros:
  ros__parameters:
    # Flight controller connection
    fcu_url: "/dev/ttyACM0:921600"   # Cube Orange USB
    # fcu_url: "/dev/ttyUSB0:921600" # FTDI adapter
    # fcu_url: "udp://:14540@localhost:14557"  # SITL

    gcs_url: ""   # Set to "udp://@<GCS_IP>:14550" for QGroundControl

    target_system_id:    1
    target_component_id: 1
    fcu_protocol:        "v2.0"
    system_id:           1
    component_id:        191   # MAV_COMP_ID_ONBOARD_COMPUTER

    # Plugin allowlist — only UAV-relevant plugins
    plugin_allowlist:
      - sys_status
      - sys_time
      - command
      - setpoint_position
      - setpoint_velocity
      - setpoint_attitude
      - vision_pose_estimate
      - local_position
      - global_position
      - imu
      - rc_io
      - safety_area

    # Blacklist heavy/unused plugins to save memory on Pi 5
    plugin_denylist:
      - actuator_control
      - altitude
      - cam_imu_sync
      - distance_sensor
      - fake_gps
      - hil
      - home_position
      - landing_target
      - log_transfer
      - mocap_pose_estimate
      - mount_control
      - obstacle_distance
      - odom
      - optical_flow
      - play_tune
      - px4flow
      - rangefinder
      - terrain
      - trajectory
      - vibration
      - wheel_odometry

    local_position:
      frame_id: "map"
      tf:
        send: false
        frame_id: "map"
        child_frame_id: "base_link"
        listen: false

    vision_pose_estimate:
      tf:
        listen: false
